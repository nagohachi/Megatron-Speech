name: Ruff

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Ruff version is read from the dev dependencies in pyproject.toml.
      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check

      - name: ruff format --check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check
